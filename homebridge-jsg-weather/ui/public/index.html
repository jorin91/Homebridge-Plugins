<script>
  const PLATFORM_NAME = 'JsgWeather'
  const DEFAULT_SOURCE_TYPE = 'json'
  const DEFAULT_INTERVAL_MINUTES = 5
  const DEFAULT_ACCESSORY_NAME = 'Weather'
  const MINIMUM_INTERVAL_MINUTES = 1
  const MAXIMUM_INTERVAL_MINUTES = 1440

  const DEFAULT_BLOCK = Object.freeze({
    platform: PLATFORM_NAME,
    sourceType: DEFAULT_SOURCE_TYPE,
    source: '',
    interval: DEFAULT_INTERVAL_MINUTES,
    name: DEFAULT_ACCESSORY_NAME,
    mappings: []
  })

  let lastSynchronizedConfig = null
  let synchronizationQueue = Promise.resolve()

  /**
   * <summary>
   * Determines whether a value is a non-array object that can safely be read as a configuration block or mapping.
   * </summary>
   * @param {*} value The value to inspect.
   * @returns {boolean} True when the value is a non-null object and not an array.
   */
  function isObject(value) {
    return value !== null && typeof value === 'object' && !Array.isArray(value)
  }

  /**
   * <summary>
   * Normalizes the optional accessory display name while keeping a stable and readable default for empty input.
   * </summary>
   * @param {*} value The configured accessory name.
   * @returns {string} A trimmed accessory name or the default Weather name.
   */
  function normalizeName(value) {
    if (typeof value !== 'string') {
      return DEFAULT_ACCESSORY_NAME
    }

    const normalized = value.trim()
    return normalized.length > 0 ? normalized : DEFAULT_ACCESSORY_NAME
  }

  /**
   * <summary>
   * Normalizes the source format identifier. Non-empty identifiers are retained so future source handlers can be
   * added without rewriting this UI fragment.
   * </summary>
   * @param {*} value The configured source type.
   * @returns {string} A lowercase source type or the JSON default.
   */
  function normalizeSourceType(value) {
    if (typeof value !== 'string') {
      return DEFAULT_SOURCE_TYPE
    }

    const normalized = value.trim().toLowerCase()
    return normalized.length > 0 ? normalized : DEFAULT_SOURCE_TYPE
  }

  /**
   * <summary>
   * Normalizes the provider-independent source location without inspecting or rewriting its query or credentials.
   * </summary>
   * @param {*} value The configured source location.
   * @returns {string} The trimmed source string or an empty string.
   */
  function normalizeSource(value) {
    return typeof value === 'string' ? value.trim() : ''
  }

  /**
   * <summary>
   * Normalizes the polling interval to a whole number of minutes supported by the configuration schema. Invalid,
   * fractional, and out-of-range values use the documented five-minute default.
   * </summary>
   * @param {*} value The configured interval value.
   * @returns {number} A valid whole-minute polling interval.
   */
  function normalizeInterval(value) {
    const numericValue = typeof value === 'number' ? value : Number(value)

    if (
      !Number.isInteger(numericValue) ||
      numericValue < MINIMUM_INTERVAL_MINUTES ||
      numericValue > MAXIMUM_INTERVAL_MINUTES
    ) {
      return DEFAULT_INTERVAL_MINUTES
    }

    return numericValue
  }

  /**
   * <summary>
   * Converts one mapping entry into the complete public mapping shape used by the plugin. The user-visible
   * measurement name, canonical unit key, and source path are trimmed but otherwise preserved so repeated units can
   * remain distinct through their names. Empty strings remain present while a newly added schema row is being edited.
   * </summary>
   * @param {*} mapping The mapping value received from the schema form.
   * @returns {{name: string, unit: string, path: string}|null} Mapping containing exactly name, unit, and path, or null when the input cannot represent a mapping.
   */
  function normalizeMapping(mapping) {
    if (!isObject(mapping)) {
      return null
    }

    return {
      name: typeof mapping.name === 'string' ? mapping.name.trim() : '',
      unit: typeof mapping.unit === 'string' ? mapping.unit.trim() : '',
      path: typeof mapping.path === 'string' ? mapping.path.trim() : ''
    }
  }

  /**
   * <summary>
   * Normalizes all mapping rows and removes values that cannot represent mapping objects. Every retained row
   * contains exactly the name, unit, and path properties in its original order. Measurement names are intentionally
   * not translated because they are the labels chosen by the user.
   * </summary>
   * @param {*} value The configured mappings value.
   * @returns {Array<{name: string, unit: string, path: string}>} Provider-independent normalized mapping rows.
   */
  function normalizeMappings(value) {
    if (!Array.isArray(value)) {
      return []
    }

    const normalizedMappings = []
    for (const mapping of value) {
      const normalizedMapping = normalizeMapping(mapping)
      if (normalizedMapping !== null) {
        normalizedMappings.push(normalizedMapping)
      }
    }

    return normalizedMappings
  }

  /**
   * <summary>
   * Builds the one supported platform block from only the public weather source, interval, name, and mapping
   * settings plus Homebridge's required platform key. Unknown properties are intentionally discarded.
   * </summary>
   * @param {*} block The first stored platform configuration block.
   * @returns {{platform: string, sourceType: string, source: string, interval: number, name: string, mappings: Array<{name: string, unit: string, path: string}>}} The normalized singular platform block.
   */
  function normalizeBlock(block) {
    const source = isObject(block) ? block : DEFAULT_BLOCK

    return {
      platform: PLATFORM_NAME,
      sourceType: normalizeSourceType(source.sourceType),
      source: normalizeSource(source.source),
      interval: normalizeInterval(source.interval),
      name: normalizeName(source.name),
      mappings: normalizeMappings(source.mappings)
    }
  }

  /**
   * <summary>
   * Normalizes Homebridge's array of plugin blocks to exactly one JSG Weather block because this plugin is singular.
   * </summary>
   * @param {*} config Plugin configuration returned by Homebridge or emitted by the schema form.
   * @returns {Array<object>} Array containing exactly one normalized platform block.
   */
  function normalizeConfig(config) {
    const firstBlock = Array.isArray(config) && config.length > 0 ? config[0] : DEFAULT_BLOCK
    return [normalizeBlock(firstBlock)]
  }

  /**
   * <summary>
   * Compares two small normalized configuration structures by serialized value. Property order is deterministic
   * because all compared structures are created locally.
   * </summary>
   * @param {*} first The first configuration value.
   * @param {*} second The second configuration value.
   * @returns {boolean} True when both values contain the same configuration data.
   */
  function isSameConfig(first, second) {
    return JSON.stringify(first) === JSON.stringify(second)
  }

  /**
   * <summary>
   * Applies normalized configuration to Homebridge's in-memory plugin model while avoiding redundant writes.
   * </summary>
   * @param {*} pluginConfig Complete plugin configuration to normalize and apply.
   * @returns {Promise<Array<object>>} Configuration confirmed by Homebridge or the requested normalized value.
   * @sideEffect Updates the unsaved plugin configuration shown by Homebridge when required.
   */
  async function setPluginConfig(pluginConfig) {
    const normalizedConfig = normalizeConfig(pluginConfig)
    const inputNeedsCleanup = !isSameConfig(pluginConfig, normalizedConfig)
    const valueChanged = !isSameConfig(lastSynchronizedConfig, normalizedConfig)

    if (!inputNeedsCleanup && !valueChanged) {
      return normalizedConfig
    }

    const updatedConfig = await homebridge.updatePluginConfig(normalizedConfig)
    lastSynchronizedConfig = normalizeConfig(Array.isArray(updatedConfig) ? updatedConfig : normalizedConfig)
    return lastSynchronizedConfig
  }

  /**
   * <summary>
   * Queues one schema-form change behind earlier updates so rapid edits cannot complete out of order and restore an
   * older configuration snapshot.
   * </summary>
   * @param {*} pluginConfig Complete configuration snapshot emitted by Homebridge.
   * @returns {Promise<Array<object>>} Promise resolving after this snapshot has been synchronized.
   * @sideEffect Extends the shared synchronization queue.
   */
  function synchronizeConfig(pluginConfig) {
    const snapshot = normalizeConfig(pluginConfig)

    /**
     * <summary>
     * Applies the immutable normalized snapshot when its position in the synchronization queue is reached.
     * </summary>
     * @returns {Promise<Array<object>>} Configuration produced by the Homebridge update.
     * @sideEffect May update Homebridge's in-memory plugin configuration.
     */
    function applySnapshot() {
      return setPluginConfig(snapshot)
    }

    synchronizationQueue = synchronizationQueue.then(applySnapshot, applySnapshot)
    return synchronizationQueue
  }

  /**
   * <summary>
   * Reports failed asynchronous schema synchronization without preventing later changes from being processed.
   * </summary>
   * @param {*} error The error produced while updating plugin configuration.
   * @returns {void}
   * @sideEffect Writes the synchronization failure to the browser console.
   */
  function handleSynchronizationError(error) {
    console.error('Unable to synchronize the JSG Weather configuration', error)
  }

  /**
   * <summary>
   * Receives full configuration snapshots from Homebridge's schema form and schedules ordered synchronization.
   * </summary>
   * @param {MessageEvent} event The configChanged event containing plugin blocks.
   * @returns {void}
   * @sideEffect Schedules an asynchronous in-memory configuration update.
   */
  function handleConfigChanged(event) {
    synchronizeConfig(event.data).catch(handleSynchronizationError)
  }

  /**
   * <summary>
   * Loads current plugin configuration, installs schema change handling, and reveals the generated form after any
   * required normalization update.
   * </summary>
   * @returns {Promise<void>} Promise that resolves when initialization finishes.
   * @sideEffect Controls Homebridge UI state, registers one listener, and may normalize in-memory configuration.
   */
  async function initialize() {
    homebridge.showSpinner()
    homebridge.disableSaveButton()
    homebridge.addEventListener('configChanged', handleConfigChanged)

    try {
      const currentConfig = await homebridge.getPluginConfig()
      const normalizedConfig = normalizeConfig(currentConfig)

      lastSynchronizedConfig = normalizedConfig
      if (!isSameConfig(currentConfig, normalizedConfig)) {
        lastSynchronizedConfig = null
        await setPluginConfig(currentConfig)
      }
    } finally {
      homebridge.showSchemaForm()
      homebridge.hideSpinner()
      homebridge.enableSaveButton()
    }
  }

  /**
   * <summary>
   * Reports an initialization failure after standard Homebridge controls have been restored by the initializer.
   * </summary>
   * @param {*} error The initialization error.
   * @returns {void}
   * @sideEffect Writes the initialization failure to the browser console.
   */
  function handleInitializationError(error) {
    console.error('Unable to initialize the JSG Weather configuration UI', error)
  }

  /**
   * <summary>
   * Starts asynchronous UI initialization after the custom UI document and injected Homebridge object are ready.
   * </summary>
   * @returns {void}
   * @sideEffect Starts loading and synchronizing plugin configuration.
   */
  function handleWindowLoad() {
    initialize().catch(handleInitializationError)
  }

  window.addEventListener('load', handleWindowLoad)
</script>
